<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>收藏学习台</title>
<meta name="theme-color" content="#f7f4ee">
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="apple-touch-icon" href="/static/logo.svg">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/skin.css?v=1">
<!-- 直接打开首页（没带 #/xxx）会转去学习库：转之前先不显示，免得闪一下 -->
<script>if(!location.hash)document.documentElement.style.visibility='hidden'</script>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="lgside" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d98b4b"/><stop offset="1" stop-color="#8c471c"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#lgside)"/><path d="M32 22c-5.6-3.3-12.2-4.2-19-3.7v27.2c6.8-.5 13.4.4 19 3.7z" fill="#fffaf2"/><path d="M32 22c5.6-3.3 12.2-4.2 19-3.7v27.2c-6.8-.5-13.4.4-19 3.7z" fill="#f2e3cf"/><path d="M32 22v27.2" stroke="#d9c1a3" stroke-width="1"/><path d="M19.2 27.6v9.6l8-4.8z" fill="#9a5226"/><rect x="35.6" y="26" width="11.6" height="3.6" rx="1.4" fill="#ffd34d"/><rect x="35.6" y="32.4" width="11.6" height="2.2" rx="1.1" fill="#c7a682"/><rect x="35.6" y="37.6" width="8.2" height="2.2" rx="1.1" fill="#c7a682"/><path d="M49.5 5.5l1.7 3.5 3.8.6-2.8 2.7.7 3.8-3.4-1.8-3.4 1.8.7-3.8-2.8-2.7 3.8-.6z" fill="#ffd34d"/></svg></div>
      <div><div class="brand-name">收藏学习台</div><div class="brand-sub">抖音 + 小红书收藏 → 阅读</div></div>
    </div>
    <nav class="nav">
      <a href="#/start" data-nav="start" id="navStart" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg>开始使用 <span class="pill" id="navStartN"></span></a>
      <a href="/reader" data-nav="library">学习库</a>
      <a href="#/process" data-nav="process"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>添加与处理 <span class="pill" id="navQueue" hidden></span></a>
      <a href="#/graph" data-nav="graph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="7" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.3 8.2 10.8 16M15.9 7.6 13.2 16M8.5 6.8l7-.6"/></svg>知识网络</a>
      <a href="#/weekly" data-nav="weekly"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 3v3M16 3v3M8 14h2M14 14h2M8 17h2"/></svg>每周周报 <span class="pill" id="navWeekly" hidden>新</span></a>
    </nav>
    <nav class="nav nav-bottom">
      <a href="#/settings" data-nav="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1M5.6 18.4l2.1-2.1m8.6-8.6 2.1-2.1"/><circle cx="12" cy="12" r="3.2"/></svg>设置</a>
    </nav>
    <div class="side-foot" id="sideStatus">就绪</div>
  </aside>

  <main class="main" id="view"></main>
</div>

<div class="modal" id="addModal" hidden>
  <div class="modal-card">
    <div class="modal-head"><h2>添加视频或图文</h2><button class="icon" data-close>✕</button></div>
    <p class="muted">在抖音里点「分享 → 复制链接」，把内容粘贴到下面。可以一次粘贴很多条，一行一条或混在一起都行。</p>
    <textarea id="addText" rows="7" placeholder="例如：7.89 复制打开抖音，看看【xxx的作品】这3个AI工具… https://v.douyin.com/xxxxxx/"></textarea>
    <div class="modal-foot">
      <a href="#/process" data-close class="link">更多方式：同步整个收藏夹 / 导入本地视频 →</a>
      <button class="btn primary" id="addSubmit">添加并开始处理</button>
    </div>
  </div>
</div>

<div class="modal" id="loginModal" hidden>
  <div class="modal-card">
    <div class="modal-head"><h2>先确认登录</h2><button class="icon" id="lgClose">✕</button></div>
    <p class="muted" id="lgIntro">整理前先看一下抖音、小红书有没有登录，免得整理到一半卡在扫码上。</p>
    <ul class="login-list" id="lgList"></ul>
    <p class="small" id="lgMsg"></p>
    <div class="modal-foot">
      <button class="btn" id="lgCancel">取消</button>
      <span class="spacer"></span>
      <button class="btn danger" id="lgPartial" hidden>不等了，只整理已登录的</button>
      <button class="btn primary" id="lgDone" hidden>我登好了，检查一下</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<script src="/static/app.js?v=14"></script>
</body>
</html>
